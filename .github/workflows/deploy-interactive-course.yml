name: Deploy Interactive Course to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/analyze-repo-structure-ioLtJ
    paths:
      - 'interactive-course-poc/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r interactive-course-poc/requirements.txt

      - name: Build Jupyter Book
        run: |
          cd interactive-course-poc
          jupyter-book build .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./interactive-course-poc/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

name: Deploy Interactive Course to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/analyze-repo-structure-ioLtJ
    paths:
      - 'interactive-course-poc/**'
      - '.github/workflows/deploy-interactive-course.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r interactive-course-poc/requirements.txt

      - name: Build Jupyter Book
        run: |
          cd interactive-course-poc
          jupyter-book build .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./interactive-course-poc/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

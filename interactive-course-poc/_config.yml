# Book settings
title: AN7914 Data Analytics and Modelling
author: University of Winchester
logo: ""

# Force re-execution of notebooks on each build.
execute:
  execute_notebooks: auto
  timeout: 120

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/sakibanwar/Data-Analytics-and-Modeling-Course-23-24
  path_to_book: interactive-course-poc
  branch: claude/analyze-repo-structure-ioLtJ

# Add GitHub buttons to your book
html:
  use_issues_button: true
  use_repository_button: true
  extra_footer: |
    <p>AN7914 Data Analytics and Modelling 2023-24</p>

# Enable JupyterLite integration
launch_buttons:
  notebook_interface: "jupyterlab"
  binderhub_url: ""
  jupyterhub_url: ""
  thebe: true

sphinx:
  extra_extensions:
    - sphinx_thebe
  config:
    html_theme: sphinx_book_theme
    html_theme_options:
      launch_buttons:
        thebe: true
    thebe_config:
      repository_url: https://github.com/sakibanwar/Data-Analytics-and-Modeling-Course-23-24
      repository_branch: claude/analyze-repo-structure-ioLtJ
      path_to_book: interactive-course-poc
      selector: ".thebe,.cell"
      # Use lite kernel for in-browser execution
      use_thebe_lite: true
